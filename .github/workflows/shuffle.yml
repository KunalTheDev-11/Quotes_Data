name: Shuffle JSON Contents

on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab
  schedule:
    - cron: '*/10 * * * *' # Runs automatically every 10 minutes

jobs:
  shuffle-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Shuffle JSON arrays
        run: |
          python -c '
          import os, json, random
          
          # Walk through all directories and files
          for root, dirs, files in os.walk("."):
              # Skip hidden folders like .git and .github
              if ".git" in root or ".github" in root:
                  continue
                  
              for file in files:
                  if file.endswith(".json"):
                      path = os.path.join(root, file)
                      
                      # Read the JSON file
                      with open(path, "r", encoding="utf-8-sig") as f:
                          try:
                              data = json.load(f)
                          except json.JSONDecodeError:
                              print(f"Skipping {path} - Invalid JSON")
                              continue
                              
                      # Shuffle only if the JSON root is an array/list
                      if isinstance(data, list):
                          random.shuffle(data)
                          
                          # Write the shuffled data back to the same file
                          with open(path, "w", encoding="utf-8") as f:
                              json.dump(data, f, indent=4, ensure_ascii=False)
                          print(f"Shuffled contents of {path}")
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          # Check if there are any changes to commit to prevent errors
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated Cloud API Shuffle Matrix Update [Skip CI]"
            git push
          fi
